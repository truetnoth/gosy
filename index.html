очностью поиска. Полнота показывает, сколько релевантных документов найдено, точность — какая доля найденных документов действительно соответствует запросу.\n\n**Теги:** документальная ИС; документ; информационно-поисковый язык; индексирование; поисковый аппарат; полнотекстовый поиск"}, {"id": 19, "section": "Информационные системы и технологии", "question": "Фактографические информационные системы. Понятие предметной области, информационный объект ПО. Понятие сущности, свойства сущности. Реализация сущности. Целостность данных", "short_answer": "фактографические ИС хранят структурированные факты о предметной области: объектах, их свойствах и связях. Такие системы обычно реализуются на базе моделей данных и СУБД.", "answer": "фактографическая информационная система предназначена для хранения и обработки конкретных фактов: сведений о клиентах, товарах, заказах, платежах, сотрудниках, договорах. В отличие от документальной ИС, она выдает не только документы, а структурированные данные и результаты их обработки.\n\nПредметная область — часть реального мира, которая изучается и автоматизируется в рамках ИС. Например, для интернет-магазина предметная область включает покупателей, товары, заказы, оплату, доставку, склад. Информационный объект предметной области — объект, о котором в системе хранятся данные. Он описывается набором свойств и связей с другими объектами.\n\nСущность — класс однотипных объектов предметной области, существенных для системы. Например, Клиент, Товар, Заказ, Поставщик. Экземпляр сущности — конкретный объект: клиент Иванов, товар с артикулом 123. Свойства сущности называются атрибутами: у клиента это ФИО, телефон, адрес; у товара — наименование, цена, остаток.\n\nРеализация сущности в реляционной базе данных обычно выполняется через таблицу. Сущность становится отношением, атрибуты — столбцами, экземпляры — строками. Для идентификации записей используется первичный ключ. Связи между сущностями реализуются внешними ключами или отдельными таблицами связей.\n\nЦелостность данных означает правильность, непротиворечивость и согласованность данных. Выделяют сущностную целостность: первичный ключ не должен быть пустым и должен однозначно идентифицировать запись; ссылочную целостность: внешний ключ должен ссылаться на существующую запись; доменную целостность: значения должны принадлежать допустимому домену; пользовательскую целостность: выполнение бизнес-правил, например запрет отрицательного остатка товара.", "tags": ["фактографическая ИС", "предметная область", "информационный объект", "сущность", "атрибут", "целостность данных", "первичный ключ"], "markdown": "### 19. Фактографические информационные системы. Понятие предметной области, информационный объект ПО. Понятие сущности, свойства сущности. Реализация сущности. Целостность данных\n\n**Кратко:** фактографические ИС хранят структурированные факты о предметной области: объектах, их свойствах и связях. Такие системы обычно реализуются на базе моделей данных и СУБД.\n\n**Ответ:** фактографическая информационная система предназначена для хранения и обработки конкретных фактов: сведений о клиентах, товарах, заказах, платежах, сотрудниках, договорах. В отличие от документальной ИС, она выдает не только документы, а структурированные данные и результаты их обработки.\n\nПредметная область — часть реального мира, которая изучается и автоматизируется в рамках ИС. Например, для интернет-магазина предметная область включает покупателей, товары, заказы, оплату, доставку, склад. Информационный объект предметной области — объект, о котором в системе хранятся данные. Он описывается набором свойств и связей с другими объектами.\n\nСущность — класс однотипных объектов предметной области, существенных для системы. Например, Клиент, Товар, Заказ, Поставщик. Экземпляр сущности — конкретный объект: клиент Иванов, товар с артикулом 123. Свойства сущности называются атрибутами: у клиента это ФИО, телефон, адрес; у товара — наименование, цена, остаток.\n\nРеализация сущности в реляционной базе данных обычно выполняется через таблицу. Сущность становится отношением, атрибуты — столбцами, экземпляры — строками. Для идентификации записей используется первичный ключ. Связи между сущностями реализуются внешними ключами или отдельными таблицами связей.\n\nЦелостность данных означает правильность, непротиворечивость и согласованность данных. Выделяют сущностную целостность: первичный ключ не должен быть пустым и должен однозначно идентифицировать запись; ссылочную целостность: внешний ключ должен ссылаться на существующую запись; доменную целостность: значения должны принадлежать допустимому домену; пользовательскую целостность: выполнение бизнес-правил, например запрет отрицательного остатка товара.\n\n**Теги:** фактографическая ИС; предметная область; информационный объект; сущность; атрибут; целостность данных; первичный ключ"}, {"id": 20, "section": "Информационные системы и технологии", "question": "Фактографические информационные системы. Концептуальное моделирование, концептуальные средства описания, модель «сущность-связь». Виды связей", "short_answer": "концептуальное моделирование описывает предметную область независимо от конкретной СУБД. Наиболее распространенное средство — ER-модель, где сущности, атрибуты и связи показывают структуру данных.", "answer": "концептуальное моделирование используется на ранних этапах проектирования фактографической ИС. Его цель — понять, какие объекты предметной области важны, какими свойствами они обладают и как связаны между собой. Концептуальная модель не зависит от конкретной базы данных, языка программирования и физического хранения данных.\n\nСредства концептуального описания включают словесное описание предметной области, глоссарий понятий, диаграммы «сущность-связь», информационные модели, классификаторы, правила целостности. Главная задача — сформировать общую картину данных, понятную разработчикам и специалистам предметной области.\n\nМодель «сущность-связь» (ER-модель) включает сущности, атрибуты, связи и ограничения. Сущность обозначает класс объектов, например Клиент или Заказ. Атрибуты описывают свойства сущности. Связь показывает отношение между сущностями: клиент оформляет заказ, заказ содержит товары, сотрудник работает в отделе.\n\nСвязи классифицируют по мощности. Связь «один к одному» означает, что одному экземпляру первой сущности соответствует не более одного экземпляра второй. Связь «один ко многим» — одному экземпляру первой сущности соответствует много экземпляров второй, например один клиент имеет много заказов. Связь «многие ко многим» — много экземпляров одной сущности связаны со многими экземплярами другой, например заказы и товары; в реляционной модели она обычно реализуется через промежуточную таблицу.\n\nТакже учитывают обязательность участия: связь может быть обязательной или необязательной. Например, заказ обязательно принадлежит клиенту, а клиент может пока не иметь заказов. Концептуальная модель затем преобразуется в логическую модель данных и структуру таблиц.", "tags": ["концептуальное моделирование", "ER-модель", "сущность-связь", "атрибут", "связь один ко многим", "многие ко многим"], "markdown": "### 20. Фактографические информационные системы. Концептуальное моделирование, концептуальные средства описания, модель «сущность-связь». Виды связей\n\n**Кратко:** концептуальное моделирование описывает предметную область независимо от конкретной СУБД. Наиболее распространенное средство — ER-модель, где сущности, атрибуты и связи показывают структуру данных.\n\n**Ответ:** концептуальное моделирование используется на ранних этапах проектирования фактографической ИС. Его цель — понять, какие объекты предметной области важны, какими свойствами они обладают и как связаны между собой. Концептуальная модель не зависит от конкретной базы данных, языка программирования и физического хранения данных.\n\nСредства концептуального описания включают словесное описание предметной области, глоссарий понятий, диаграммы «сущность-связь», информационные модели, классификаторы, правила целостности. Главная задача — сформировать общую картину данных, понятную разработчикам и специалистам предметной области.\n\nМодель «сущность-связь» (ER-модель) включает сущности, атрибуты, связи и ограничения. Сущность обозначает класс объектов, например Клиент или Заказ. Атрибуты описывают свойства сущности. Связь показывает отношение между сущностями: клиент оформляет заказ, заказ содержит товары, сотрудник работает в отделе.\n\nСвязи классифицируют по мощности. Связь «один к одному» означает, что одному экземпляру первой сущности соответствует не более одного экземпляра второй. Связь «один ко многим» — одному экземпляру первой сущности соответствует много экземпляров второй, например один клиент имеет много заказов. Связь «многие ко многим» — много экземпляров одной сущности связаны со многими экземплярами другой, например заказы и товары; в реляционной модели она обычно реализуется через промежуточную таблицу.\n\nТакже учитывают обязательность участия: связь может быть обязательной или необязательной. Например, заказ обязательно принадлежит клиенту, а клиент может пока не иметь заказов. Концептуальная модель затем преобразуется в логическую модель данных и структуру таблиц.\n\n**Теги:** концептуальное моделирование; ER-модель; сущность-связь; атрибут; связь один ко многим; многие ко многим"}, {"id": 21, "section": "Информационные системы и технологии", "question": "Программные средства реализации фактографических ИС. Понятие модели данных, основные компоненты модели. Виды моделей данных. Общие понятия СУБД. Классификация СУБД. Функции СУБД", "short_answer": "фактографические ИС чаще всего реализуются средствами СУБД. Модель данных определяет, как данные структурируются, какие операции над ними допустимы и какие ограничения целостности действуют.", "answer": "программные средства реализации фактографических ИС включают СУБД, языки запросов, средства разработки приложений, серверы приложений, интерфейсы доступа к данным, отчеты, средства администрирования и защиты. Центральную роль играет база данных — организованная совокупность взаимосвязанных данных, и СУБД — программная система для создания, хранения, обработки и управления базами данных.\n\nМодель данных — это совокупность правил описания структуры данных, операций над ними и ограничений целостности. Основные компоненты модели данных: структуры данных, операции обработки данных и ограничения. Структуры определяют, как представлены объекты; операции — как данные можно выбирать, изменять, добавлять, удалять; ограничения — какие значения и связи допустимы.\n\nВиды моделей данных: иерархическая, сетевая, реляционная, объектно-ориентированная, объектно-реляционная, документо-ориентированная, графовая. В классических ИС наиболее важна реляционная модель, где данные представлены таблицами.\n\nСУБД классифицируют по модели данных, масштабу, архитектуре, числу пользователей, способу размещения и назначению. Бывают настольные и серверные СУБД, однопользовательские и многопользовательские, централизованные и распределенные, реляционные и нереляционные.\n\nФункции СУБД: определение структуры данных; создание и изменение баз данных; ввод, изменение, удаление и поиск данных; обработка запросов; поддержка целостности; управление транзакциями; разграничение доступа; резервное копирование и восстановление; журналирование; оптимизация запросов; поддержка конкурентного доступа; администрирование. Благодаря СУБД прикладные программы получают единый и надежный механизм работы с данными.", "tags": ["СУБД", "модель данных", "база данных", "фактографическая ИС", "реляционная модель", "функции СУБД"], "markdown": "### 21. Программные средства реализации фактографических ИС. Понятие модели данных, основные компоненты модели. Виды моделей данных. Общие понятия СУБД. Классификация СУБД. Функции СУБД\n\n**Кратко:** фактографические ИС чаще всего реализуются средствами СУБД. Модель данных определяет, как данные структурируются, какие операции над ними допустимы и какие ограничения целостности действуют.\n\n**Ответ:** программные средства реализации фактографических ИС включают СУБД, языки запросов, средства разработки приложений, серверы приложений, интерфейсы доступа к данным, отчеты, средства администрирования и защиты. Центральную роль играет база данных — организованная совокупность взаимосвязанных данных, и СУБД — программная система для создания, хранения, обработки и управления базами данных.\n\nМодель данных — это совокупность правил описания структуры данных, операций над ними и ограничений целостности. Основные компоненты модели данных: структуры данных, операции обработки данных и ограничения. Структуры определяют, как представлены объекты; операции — как данные можно выбирать, изменять, добавлять, удалять; ограничения — какие значения и связи допустимы.\n\nВиды моделей данных: иерархическая, сетевая, реляционная, объектно-ориентированная, объектно-реляционная, документо-ориентированная, графовая. В классических ИС наиболее важна реляционная модель, где данные представлены таблицами.\n\nСУБД классифицируют по модели данных, масштабу, архитектуре, числу пользователей, способу размещения и назначению. Бывают настольные и серверные СУБД, однопользовательские и многопользовательские, централизованные и распределенные, реляционные и нереляционные.\n\nФункции СУБД: определение структуры данных; создание и изменение баз данных; ввод, изменение, удаление и поиск данных; обработка запросов; поддержка целостности; управление транзакциями; разграничение доступа; резервное копирование и восстановление; журналирование; оптимизация запросов; поддержка конкурентного доступа; администрирование. Благодаря СУБД прикладные программы получают единый и надежный механизм работы с данными.\n\n**Теги:** СУБД; модель данных; база данных; фактографическая ИС; реляционная модель; функции СУБД"}, {"id": 22, "section": "Информационные системы и технологии", "question": "Программные средства реализации фактографических ИС. Архитектура СУБД, независимость данных. Типы моделей данных. Сетевая и иерархическая модели данных. Представление данных, операции над данными, ограничение целостности", "short_answer": "архитектура СУБД разделяет уровни представления данных и обеспечивает независимость приложений от физического хранения. Иерархическая и сетевая модели — ранние модели данных, основанные на записях и связях.", "answer": "архитектура СУБД обычно рассматривается через три уровня: внешний, концептуальный и внутренний. Внешний уровень описывает представления данных для отдельных пользователей и приложений. Концептуальный уровень задает общую логическую структуру базы данных. Внутренний уровень описывает физическое размещение данных, индексы, файлы, способы доступа. Такая архитектура обеспечивает независимость данных: приложения меньше зависят от изменений структуры хранения или логической схемы.\n\nЛогическая независимость означает возможность изменять концептуальную схему без полного переписывания пользовательских представлений. Физическая независимость означает возможность менять способы хранения, индексы и файлы без изменения прикладных программ.\n\nИерархическая модель представляет данные в виде дерева. Каждый дочерний узел имеет одного родителя. Операции обычно связаны с навигацией по дереву: найти родителя, перейти к потомку, добавить или удалить запись. Такая модель эффективна для жестких иерархий, но плохо подходит для связей многие ко многим.\n\nСетевая модель расширяет иерархическую: запись может иметь несколько владельцев, связи представляются наборами. Она лучше описывает сложные связи, но требует навигационного доступа и усложняет проектирование.\n\nВ обеих моделях данные представлены записями и связями между ними. Ограничения целостности включают правила существования связей, допустимость ссылок, уникальность идентификаторов, подчиненность записей. Эти модели исторически важны, но в большинстве прикладных экономических ИС вытеснены реляционной моделью, которая обеспечивает более удобное декларативное описание данных и запросов.", "tags": ["архитектура СУБД", "независимость данных", "внешний уровень", "концептуальный уровень", "иерархическая модель", "сетевая модель"], "markdown": "### 22. Программные средства реализации фактографических ИС. Архитектура СУБД, независимость данных. Типы моделей данных. Сетевая и иерархическая модели данных. Представление данных, операции над данными, ограничение целостности\n\n**Кратко:** архитектура СУБД разделяет уровни представления данных и обеспечивает независимость приложений от физического хранения. Иерархическая и сетевая модели — ранние модели данных, основанные на записях и связях.\n\n**Ответ:** архитектура СУБД обычно рассматривается через три уровня: внешний, концептуальный и внутренний. Внешний уровень описывает представления данных для отдельных пользователей и приложений. Концептуальный уровень задает общую логическую структуру базы данных. Внутренний уровень описывает физическое размещение данных, индексы, файлы, способы доступа. Такая архитектура обеспечивает независимость данных: приложения меньше зависят от изменений структуры хранения или логической схемы.\n\nЛогическая независимость означает возможность изменять концептуальную схему без полного переписывания пользовательских представлений. Физическая независимость означает возможность менять способы хранения, индексы и файлы без изменения прикладных программ.\n\nИерархическая модель представляет данные в виде дерева. Каждый дочерний узел имеет одного родителя. Операции обычно связаны с навигацией по дереву: найти родителя, перейти к потомку, добавить или удалить запись. Такая модель эффективна для жестких иерархий, но плохо подходит для связей многие ко многим.\n\nСетевая модель расширяет иерархическую: запись может иметь несколько владельцев, связи представляются наборами. Она лучше описывает сложные связи, но требует навигационного доступа и усложняет проектирование.\n\nВ обеих моделях данные представлены записями и связями между ними. Ограничения целостности включают правила существования связей, допустимость ссылок, уникальность идентификаторов, подчиненность записей. Эти модели исторически важны, но в большинстве прикладных экономических ИС вытеснены реляционной моделью, которая обеспечивает более удобное декларативное описание данных и запросов.\n\n**Теги:** архитектура СУБД; независимость данных; внешний уровень; концептуальный уровень; иерархическая модель; сетевая модель"}, {"id": 23, "section": "Информационные системы и технологии", "question": "Типы моделей данных. Реляционная модель данных. Понятие отношения. Мощность и кардинальное число отношения. Домен отношения. Схемы отношений. Общие свойства отношений. Объектно-связанная модель", "short_answer": "реляционная модель представляет данные в виде отношений, то есть таблиц. Она основана на математическом понятии отношения и использует домены, атрибуты, кортежи, ключи и операции реляционной алгебры.", "answer": "к основным типам моделей данных относятся иерархическая, сетевая, реляционная, объектно-ориентированная, объектно-реляционная, документо-ориентированная и графовая. Наиболее распространенной в экономических ИС является реляционная модель.\n\nВ реляционной модели отношение обычно представляется как таблица. Столбцы таблицы называются атрибутами, строки — кортежами. Схема отношения задает имя отношения, перечень атрибутов и домены их значений. Например, схема Клиент(КодКлиента, ФИО, Телефон, Адрес). Домен — множество допустимых значений атрибута: целые числа, даты, строки определенной длины, денежные значения.\n\nСтепень отношения — число атрибутов в отношении. Кардинальность, или мощность отношения, — число кортежей, то есть строк. В разных учебниках термин «мощность» иногда используют для числа строк, а «степень» — для числа столбцов; важно пояснять смысл.\n\nОбщие свойства отношений: каждая строка уникальна; порядок строк несущественен; порядок столбцов логически несущественен; значения атрибутов атомарны; каждый атрибут имеет имя и домен; значения в одном столбце принадлежат одному домену. Для идентификации строк используются ключи: первичный, возможные, внешние.\n\nОбъектно-связанная, или объектно-реляционная, модель сочетает реляционную основу с объектными возможностями: пользовательские типы, наследование, методы, сложные структуры. Она применяется там, где нужно хранить не только простые таблицы, но и более сложные объекты, сохраняя преимущества реляционных СУБД.", "tags": ["модель данных", "реляционная модель", "отношение", "кортеж", "атрибут", "домен", "схема отношения", "объектно-реляционная модель"], "markdown": "### 23. Типы моделей данных. Реляционная модель данных. Понятие отношения. Мощность и кардинальное число отношения. Домен отношения. Схемы отношений. Общие свойства отношений. Объектно-связанная модель\n\n**Кратко:** реляционная модель представляет данные в виде отношений, то есть таблиц. Она основана на математическом понятии отношения и использует домены, атрибуты, кортежи, ключи и операции реляционной алгебры.\n\n**Ответ:** к основным типам моделей данных относятся иерархическая, сетевая, реляционная, объектно-ориентированная, объектно-реляционная, документо-ориентированная и графовая. Наиболее распространенной в экономических ИС является реляционная модель.\n\nВ реляционной модели отношение обычно представляется как таблица. Столбцы таблицы называются атрибутами, строки — кортежами. Схема отношения задает имя отношения, перечень атрибутов и домены их значений. Например, схема Клиент(КодКлиента, ФИО, Телефон, Адрес). Домен — множество допустимых значений атрибута: целые числа, даты, строки определенной длины, денежные значения.\n\nСтепень отношения — число атрибутов в отношении. Кардинальность, или мощность отношения, — число кортежей, то есть строк. В разных учебниках термин «мощность» иногда используют для числа строк, а «степень» — для числа столбцов; важно пояснять смысл.\n\nОбщие свойства отношений: каждая строка уникальна; порядок строк несущественен; порядок столбцов логически несущественен; значения атрибутов атомарны; каждый атрибут имеет имя и домен; значения в одном столбце принадлежат одному домену. Для идентификации строк используются ключи: первичный, возможные, внешние.\n\nОбъектно-связанная, или объектно-реляционная, модель сочетает реляционную основу с объектными возможностями: пользовательские типы, наследование, методы, сложные структуры. Она применяется там, где нужно хранить не только простые таблицы, но и более сложные объекты, сохраняя преимущества реляционных СУБД.\n\n**Теги:** модель данных; реляционная модель; отношение; кортеж; атрибут; домен; схема отношения; объектно-реляционная модель"}, {"id": 24, "section": "Информационные системы и технологии", "question": "Реляционная модель данных. Организация процессов обработки данных. Операции обработки кортежей. Операции обработки отношений", "short_answer": "обработка данных в реляционной модели выполняется над кортежами и отношениями. Основу составляют операции выборки, вставки, удаления, изменения, а также операции реляционной алгебры: проекция, селекция, соединение, объединение и другие.", "answer": "реляционная модель удобна тем, что данные представлены в виде таблиц, а операции над ними имеют строгую математическую основу. В прикладных системах обработка реализуется через языки запросов, прежде всего SQL. Процессы обработки включают ввод данных, проверку ограничений, поиск, фильтрацию, сортировку, изменение, удаление, агрегирование, формирование отчетов и транзакционную обработку.\n\nОперации обработки кортежей относятся к отдельным строкам таблицы. К ним относятся вставка нового кортежа, удаление кортежа, изменение значений атрибутов, чтение кортежа, проверка ключей и ограничений. Например, добавление нового клиента, изменение адреса, удаление ошибочной записи. При таких операциях СУБД контролирует целостность: уникальность первичного ключа, корректность внешних ключей, допустимость значений.\n\nОперации обработки отношений выполняются над таблицами как множествами кортежей. Основные операции реляционной алгебры: селекция — выбор строк по условию; проекция — выбор столбцов; объединение — соединение кортежей двух совместимых отношений; пересечение; разность; декартово произведение; соединение — объединение строк разных таблиц по связанным атрибутам; деление — более сложная операция для запросов вида «объекты, связанные со всеми объектами заданного множества».\n\nВ SQL этим операциям соответствуют SELECT, WHERE, JOIN, GROUP BY, HAVING, INSERT, UPDATE, DELETE. Организация обработки данных должна учитывать транзакции. Транзакция — логическая единица работы, которая должна выполняться полностью или не выполняться вовсе. Классические свойства транзакций: атомарность, согласованность, изолированность и долговечность. Это особенно важно в экономических ИС, где ошибки обработки данных могут привести к финансовым потерям.", "tags": ["реляционная модель", "кортеж", "отношение", "реляционная алгебра", "селекция", "проекция", "соединение", "SQL", "транзакция"], "markdown": "### 24. Реляционная модель данных. Организация процессов обработки данных. Операции обработки кортежей. Операции обработки отношений\n\n**Кратко:** обработка данных в реляционной модели выполняется над кортежами и отношениями. Основу составляют операции выборки, вставки, удаления, изменения, а также операции реляционной алгебры: проекция, селекция, соединение, объединение и другие.\n\n**Ответ:** реляционная модель удобна тем, что данные представлены в виде таблиц, а операции над ними имеют строгую математическую основу. В прикладных системах обработка реализуется через языки запросов, прежде всего SQL. Процессы обработки включают ввод данных, проверку ограничений, поиск, фильтрацию, сортировку, изменение, удаление, агрегирование, формирование отчетов и транзакционную обработку.\n\nОперации обработки кортежей относятся к отдельным строкам таблицы. К ним относятся вставка нового кортежа, удаление кортежа, изменение значений атрибутов, чтение кортежа, проверка ключей и ограничений. Например, добавление нового клиента, изменение адреса, удаление ошибочной записи. При таких операциях СУБД контролирует целостность: уникальность первичного ключа, корректность внешних ключей, допустимость значений.\n\nОперации обработки отношений выполняются над таблицами как множествами кортежей. Основные операции реляционной алгебры: селекция — выбор строк по условию; проекция — выбор столбцов; объединение — соединение кортежей двух совместимых отношений; пересечение; разность; декартово произведение; соединение — объединение строк разных таблиц по связанным атрибутам; деление — более сложная операция для запросов вида «объекты, связанные со всеми объектами заданного множества».\n\nВ SQL этим операциям соответствуют SELECT, WHERE, JOIN, GROUP BY, HAVING, INSERT, UPDATE, DELETE. Организация обработки данных должна учитывать транзакции. Транзакция — логическая единица работы, которая должна выполняться полностью или не выполняться вовсе. Классические свойства транзакций: атомарность, согласованность, изолированность и долговечность. Это особенно важно в экономических ИС, где ошибки обработки данных могут привести к финансовым потерям.\n\n**Теги:** реляционная модель; кортеж; отношение; реляционная алгебра; селекция; проекция; соединение; SQL; транзакция"}, {"id": 25, "section": "Информационные системы и технологии", "question": "Организация процессов обработки данных. Функциональная зависимость в отношениях. Нормализация отношений, первая, вторая и третья нормальные формы", "short_answer": "нормализация — это приведение структуры таблиц к форме, уменьшающей дублирование и аномалии данных. Ее основа — анализ функциональных зависимостей между атрибутами.", "answer": "функциональная зависимость в отношении означает, что значение одного атрибута или набора атрибутов однозначно определяет значение другого атрибута. Обозначается X → Y. Например, КодТовара → НаименованиеТовара, Цена, ЕдиницаИзмерения. Если по коду товара можно однозначно определить его название, между этими атрибутами есть функциональная зависимость.\n\nНеправильная структура таблиц приводит к избыточности и аномалиям. Аномалия вставки возникает, когда невозможно добавить один факт без другого. Аномалия удаления — когда удаление одной записи приводит к потере нужной информации. Аномалия обновления — когда одно и то же значение приходится менять во многих строках.\n\nНормализация — процесс разбиения отношений на более правильные структуры с учетом функциональных зависимостей. Первая нормальная форма требует, чтобы все значения атрибутов были атомарными, то есть неделимыми в рамках модели; в ячейке не должно быть списков или повторяющихся групп.\n\nВторая нормальная форма требует, чтобы отношение было в первой нормальной форме и каждый неключевой атрибут полностью зависел от всего составного ключа, а не от его части. Она актуальна, когда первичный ключ составной. Например, в таблице строк заказа с ключом (НомерЗаказа, КодТовара) наименование товара зависит только от КодТовара, поэтому его лучше вынести в таблицу Товар.\n\nТретья нормальная форма требует, чтобы отношение было во второй нормальной форме и не имело транзитивных зависимостей неключевых атрибутов от ключа. Неключевой атрибут не должен зависеть от другого неключевого атрибута. Нормализация повышает целостность данных, но чрезмерная нормализация может усложнить запросы, поэтому в практических системах иногда применяют осознанную денормализацию ради производительности.", "tags": ["функциональная зависимость", "нормализация", "1НФ", "2НФ", "3НФ", "аномалии данных", "избыточность"], "markdown": "### 25. Организация процессов обработки данных. Функциональная зависимость в отношениях. Нормализация отношений, первая, вторая и третья нормальные формы\n\n**Кратко:** нормализация — это приведение структуры таблиц к форме, уменьшающей дублирование и аномалии данных. Ее основа — анализ функциональных зависимостей между атрибутами.\n\n**Ответ:** функциональная зависимость в отношении означает, что значение одного атрибута или набора атрибутов однозначно определяет значение другого атрибута. Обозначается X → Y. Например, КодТовара → НаименованиеТовара, Цена, ЕдиницаИзмерения. Если по коду товара можно однозначно определить его название, между этими атрибутами есть функциональная зависимость.\n\nНеправильная структура таблиц приводит к избыточности и аномалиям. Аномалия вставки возникает, когда невозможно добавить один факт без другого. Аномалия удаления — когда удаление одной записи приводит к потере нужной информации. Аномалия обновления — когда одно и то же значение приходится менять во многих строках.\n\nНормализация — процесс разбиения отношений на более правильные структуры с учетом функциональных зависимостей. Первая нормальная форма требует, чтобы все значения атрибутов были атомарными, то есть неделимыми в рамках модели; в ячейке не должно быть списков или повторяющихся групп.\n\nВторая нормальная форма требует, чтобы отношение было в первой нормальной форме и каждый неключевой атрибут полностью зависел от всего составного ключа, а не от его части. Она актуальна, когда первичный ключ составной. Например, в таблице строк заказа с ключом (НомерЗаказа, КодТовара) наименование товара зависит только от КодТовара, поэтому его лучше вынести в таблицу Товар.\n\nТретья нормальная форма требует, чтобы отношение было во второй нормальной форме и не имело транзитивных зависимостей неключевых атрибутов от ключа. Неключевой атрибут не должен зависеть от другого неключевого атрибута. Нормализация повышает целостность данных, но чрезмерная нормализация может усложнить запросы, поэтому в практических системах иногда применяют осознанную денормализацию ради производительности.\n\n**Теги:** функциональная зависимость; нормализация; 1НФ; 2НФ; 3НФ; аномалии данных; избыточность"}, {"id": 26, "section": "Информационные системы и технологии", "question": "Проектирование информационной системы. Понятия и структура проекта ИС. Процессы управления проектами. Классификация проектов. Понятие и содержание процесса проектирования ИС. Составные элементы процесса проектирования", "short_answer": "проектирование ИС — это процесс разработки решений по функциям, данным, архитектуре, программам, инфраструктуре и организации работы будущей системы. Проект ИС включает цели, требования, модели, решения, документацию, план работ и ресурсы.", "answer": "проект ИС — временное целенаправленное мероприятие по созданию, модернизации или внедрению информационной системы с заданными целями, сроками, бюджетом и результатами. Структура проекта включает инициирование, обследование, требования, проектирование, разработку, тестирование, внедрение, обучение, сопровождение, управление рисками и документацию.\n\nПроцессы управления проектами включают управление содержанием, сроками, стоимостью, качеством, ресурсами, коммуникациями, рисками, закупками, заинтересованными сторонами и изменениями. Для ИС особенно важны управление требованиями и управление изменениями, потому что потребности пользователей часто уточняются в ходе проекта.\n\nПроекты классифицируют по масштабу: малые, средние, крупные; по новизне: разработка новой системы, модернизация, внедрение типового решения, интеграция; по охвату: локальные, корпоративные, межорганизационные; по методологии: каскадные, итерационные, гибкие; по предметной области: учетные, управленческие, производственные, аналитические, веб-системы.\n\nПроцесс проектирования ИС включает анализ предметной области, формирование требований, функциональное проектирование, информационное проектирование, выбор архитектуры, проектирование базы данных, интерфейсов, алгоритмов, отчетов, защиты, интеграций и организационных регламентов. Составные элементы проектирования: объект автоматизации, цели, пользователи, функции, данные, процессы, программные модули, технические средства, документация, тесты, план внедрения.\n\nКачественное проектирование должно обеспечить соответствие ИС задачам предприятия, надежность, масштабируемость, удобство пользователей, защиту информации, сопровождаемость и экономическую целесообразность.", "tags": ["проект ИС", "проектирование ИС", "управление проектами", "требования", "архитектура", "внедрение", "риски"], "markdown": "### 26. Проектирование информационной системы. Понятия и структура проекта ИС. Процессы управления проектами. Классификация проектов. Понятие и содержание процесса проектирования ИС. Составные элементы процесса проектирования\n\n**Кратко:** проектирование ИС — это процесс разработки решений по функциям, данным, архитектуре, программам, инфраструктуре и организации работы будущей системы. Проект ИС включает цели, требования, модели, решения, документацию, план работ и ресурсы.\n\n**Ответ:** проект ИС — временное целенаправленное мероприятие по созданию, модернизации или внедрению информационной системы с заданными целями, сроками, бюджетом и результатами. Структура проекта включает инициирование, обследование, требования, проектирование, разработку, тестирование, внедрение, обучение, сопровождение, управление рисками и документацию.\n\nПроцессы управления проектами включают управление содержанием, сроками, стоимостью, качеством, ресурсами, коммуникациями, рисками, закупками, заинтересованными сторонами и изменениями. Для ИС особенно важны управление требованиями и управление изменениями, потому что потребности пользователей часто уточняются в ходе проекта.\n\nПроекты классифицируют по масштабу: малые, средние, крупные; по новизне: разработка новой системы, модернизация, внедрение типового решения, интеграция; по охвату: локальные, корпоративные, межорганизационные; по методологии: каскадные, итерационные, гибкие; по предметной области: учетные, управленческие, производственные, аналитические, веб-системы.\n\nПроцесс проектирования ИС включает анализ предметной области, формирование требований, функциональное проектирование, информационное проектирование, выбор архитектуры, проектирование базы данных, интерфейсов, алгоритмов, отчетов, защиты, интеграций и организационных регламентов. Составные элементы проектирования: объект автоматизации, цели, пользователи, функции, данные, процессы, программные модули, технические средства, документация, тесты, план внедрения.\n\nКачественное проектирование должно обеспечить соответствие ИС задачам предприятия, надежность, масштабируемость, удобство пользователей, защиту информации, сопровождаемость и экономическую целесообразность.\n\n**Теги:** проект ИС; проектирование ИС; управление проектами; требования; архитектура; внедрение; риски"}, {"id": 27, "section": "Информационные системы и технологии", "question": "Понятие технологии проектирования ИС. Технологии и методы проектирования ИС. Понятие жизненного цикла ИС. Процессы жизненного цикла. Каскадная модель. Поэтапная модель с промежуточным контролем. Спиральная модель", "short_answer": "технология проектирования ИС — это упорядоченная совокупность методов, средств, стадий и правил создания системы. Жизненный цикл ИС описывает путь системы от идеи и требований до эксплуатации и вывода из использования.", "answer": "технология проектирования ИС определяет, как организовать разработку: какие стадии выполнять, какие модели строить, какие документы выпускать, какие средства использовать, как контролировать качество. Она включает методы анализа, проектирования данных и процессов, программирования, тестирования, внедрения и сопровождения.\n\nМетоды проектирования ИС могут быть структурными, объектно-ориентированными, процессными, прототипными, типовыми, модельно-ориентированными. Используются нотации IDEF0, DFD, ER, IDEF1X, UML, BPMN, CASE-средства, методы нормализации данных, методы управления требованиями.\n\nЖизненный цикл ИС — совокупность стадий существования системы: инициирование, обследование, требования, проектирование, разработка, тестирование, внедрение, эксплуатация, сопровождение, модернизация и вывод из эксплуатации. Процессы жизненного цикла делят на основные, вспомогательные и организационные: разработка, поставка, эксплуатация, сопровождение, управление проектом, контроль качества, документирование, обучение.\n\nКаскадная модель предполагает последовательное выполнение стадий: требования, проектирование, реализация, тестирование, внедрение. Она удобна при стабильных требованиях, но плохо переносит поздние изменения.\n\nПоэтапная модель с промежуточным контролем сохраняет последовательность, но после каждой стадии проводится проверка, согласование и возможная корректировка. Это снижает риск накопления ошибок.\n\nСпиральная модель строится на итерациях. На каждом витке уточняются цели, анализируются риски, создается прототип или версия, оценивается результат и планируется следующий виток. Она подходит для сложных проектов с неопределенными требованиями и высокими рисками, но требует квалифицированного управления.", "tags": ["технология проектирования", "жизненный цикл ИС", "каскадная модель", "спиральная модель", "стадии", "методы проектирования"], "markdown": "### 27. Понятие технологии проектирования ИС. Технологии и методы проектирования ИС. Понятие жизненного цикла ИС. Процессы жизненного цикла. Каскадная модель. Поэтапная модель с промежуточным контролем. Спиральная модель\n\n**Кратко:** технология проектирования ИС — это упорядоченная совокупность методов, средств, стадий и правил создания системы. Жизненный цикл ИС описывает путь системы от идеи и требований до эксплуатации и вывода из использования.\n\n**Ответ:** технология проектирования ИС определяет, как организовать разработку: какие стадии выполнять, какие модели строить, какие документы выпускать, какие средства использовать, как контролировать качество. Она включает методы анализа, проектирования данных и процессов, программирования, тестирования, внедрения и сопровождения.\n\nМетоды проектирования ИС могут быть структурными, объектно-ориентированными, процессными, прототипными, типовыми, модельно-ориентированными. Используются нотации IDEF0, DFD, ER, IDEF1X, UML, BPMN, CASE-средства, методы нормализации данных, методы управления требованиями.\n\nЖизненный цикл ИС — совокупность стадий существования системы: инициирование, обследование, требования, проектирование, разработка, тестирование, внедрение, эксплуатация, сопровождение, модернизация и вывод из эксплуатации. Процессы жизненного цикла делят на основные, вспомогательные и организационные: разработка, поставка, эксплуатация, сопровождение, управление проектом, контроль качества, документирование, обучение.\n\nКаскадная модель предполагает последовательное выполнение стадий: требования, проектирование, реализация, тестирование, внедрение. Она удобна при стабильных требованиях, но плохо переносит поздние изменения.\n\nПоэтапная модель с промежуточным контролем сохраняет последовательность, но после каждой стадии проводится проверка, согласование и возможная корректировка. Это снижает риск накопления ошибок.\n\nСпиральная модель строится на итерациях. На каждом витке уточняются цели, анализируются риски, создается прототип или версия, оценивается результат и планируется следующий виток. Она подходит для сложных проектов с неопределенными требованиями и высокими рисками, но требует квалифицированного управления.\n\n**Теги:** технология проектирования; жизненный цикл ИС; каскадная модель; спиральная модель; стадии; методы проектирования"}, {"id": 28, "section": "Информационные системы и технологии", "question": "Процессный подход к управлению организацией. Основные элементы процессного подхода. Понятие бизнес-процесса. Классификация бизнес-процессов. Качественные параметры бизнес-процесса. Способы описания бизнес-процессов", "short_answer": "процессный подход рассматривает организацию как систему взаимосвязанных бизнес-процессов, создающих ценность для клиента. Управление строится не вокруг подразделений, а вокруг результатов процессов.", "answer": "процессный подход к управлению организацией означает, что деятельность рассматривается как совокупность процессов, преобразующих входы в выходы. Такой подход помогает устранить разрывы между подразделениями, повысить ответственность за конечный результат и улучшить качество обслуживания клиента.\n\nБизнес-процесс — устойчивая последовательность взаимосвязанных действий, имеющая входы, выходы, ресурсы, исполнителей, владельца, регламенты и потребителя результата. Пример: обработка заказа клиента от поступления заявки до оплаты и доставки.\n\nОсновные элементы процессного подхода: входы, выходы, поставщики, клиенты, владелец процесса, исполнители, ресурсы, регламенты, показатели эффективности, границы процесса, контрольные точки, обратная связь. Владелец процесса отвечает за результат всего процесса, даже если операции выполняют разные подразделения.\n\nБизнес-процессы классифицируют на основные, обеспечивающие и управленческие. Основные создают ценность для клиента; обеспечивающие поддерживают основные; управленческие задают цели, планируют и контролируют деятельность. Также процессы делят на сквозные, внутрифункциональные, межфункциональные, стратегические, операционные.\n\nКачественные параметры бизнес-процесса: результативность, эффективность, длительность цикла, стоимость, качество выхода, надежность, гибкость, прозрачность, управляемость, уровень автоматизации, удовлетворенность клиента. Описание бизнес-процессов выполняют текстовыми регламентами, блок-схемами, картами процессов, IDEF0, DFD, IDEF3, BPMN, EPC, UML activity diagrams. Для проектирования ИС важно описать не только последовательность работ, но и данные, документы, роли, правила принятия решений и показатели.", "tags": ["процессный подход", "бизнес-процесс", "владелец процесса", "основные процессы", "показатели процесса", "BPMN", "IDEF0"], "markdown": "### 28. Процессный подход к управлению организацией. Основные элементы процессного подхода. Понятие бизнес-процесса. Классификация бизнес-процессов. Качественные параметры бизнес-процесса. Способы описания бизнес-процессов\n\n**Кратко:** процессный подход рассматривает организацию как систему взаимосвязанных бизнес-процессов, создающих ценность для клиента. Управление строится не вокруг подразделений, а вокруг результатов процессов.\n\n**Ответ:** процессный подход к управлению организацией означает, что деятельность рассматривается как совокупность процессов, преобразующих входы в выходы. Такой подход помогает устранить разрывы между подразделениями, повысить ответственность за конечный результат и улучшить качество обслуживания клиента.\n\nБизнес-процесс — устойчивая последовательность взаимосвязанных действий, имеющая входы, выходы, ресурсы, исполнителей, владельца, регламенты и потребителя результата. Пример: обработка заказа клиента от поступления заявки до оплаты и доставки.\n\nОсновные элементы процессного подхода: входы, выходы, поставщики, клиенты, владелец процесса, исполнители, ресурсы, регламенты, показатели эффективности, границы процесса, контрольные точки, обратная связь. Владелец процесса отвечает за результат всего процесса, даже если операции выполняют разные подразделения.\n\nБизнес-процессы классифицируют на основные, обеспечивающие и управленческие. Основные создают ценность для клиента; обеспечивающие поддерживают основные; управленческие задают цели, планируют и контролируют деятельность. Также процессы делят на сквозные, внутрифункциональные, межфункциональные, стратегические, операционные.\n\nКачественные параметры бизнес-процесса: результативность, эффективность, длительность цикла, стоимость, качество выхода, надежность, гибкость, прозрачность, управляемость, уровень автоматизации, удовлетворенность клиента. Описание бизнес-процессов выполняют текстовыми регламентами, блок-схемами, картами процессов, IDEF0, DFD, IDEF3, BPMN, EPC, UML activity diagrams. Для проектирования ИС важно описать не только последовательность работ, но и данные, документы, роли, правила принятия решений и показатели.\n\n**Теги:** процессный подход; бизнес-процесс; владелец процесса; основные процессы; показатели процесса; BPMN; IDEF0"}, {"id": 29, "section": "Информационные системы и технологии", "question": "Инжиниринг бизнес-процессов и информационных технологий. Технологии реинжиниринга и параллельного проектирования. CASE-системы в проектировании ИС. Понятие и виды CASE-средств", "short_answer": "инжиниринг бизнес-процессов и ИТ направлен на проектирование эффективной организации деятельности и поддерживающих ее информационных систем. CASE-средства автоматизируют анализ, моделирование, проектирование и документирование ИС.", "answer": "инжиниринг бизнес-процессов — целенаправленное проектирование, анализ и улучшение процессов организации. Он связан с информационными технологиями, потому что современная автоматизация часто требует изменения самих процессов, а не только переноса старых операций в программу.\n\nРеинжиниринг бизнес-процессов — радикальное переосмысление и перепроектирование процессов для существенного улучшения показателей: стоимости, качества, скорости, сервиса. В отличие от постепенного улучшения, реинжиниринг допускает глубокие изменения структуры работ, ответственности и информационных потоков. ИТ являются важным инструментом реинжиниринга: они позволяют убрать лишние согласования, объединить операции, обеспечить доступ к единой базе данных, автоматизировать контроль.\n\nПараллельное проектирование означает одновременную согласованную разработку бизнес-процессов, информационной системы, организационных регламентов и технической инфраструктуры. Это сокращает сроки и уменьшает риск несоответствия ИС реальной деятельности.\n\nCASE-система — программная среда, поддерживающая автоматизированное проектирование ИС. CASE-средства позволяют строить модели процессов и данных, проверять согласованность, генерировать документацию, иногда создавать схемы баз данных или программный код.\n\nВиды CASE-средств: верхнего уровня — для анализа требований и концептуального моделирования; нижнего уровня — для детального проектирования, генерации кода, базы данных; интегрированные — поддерживают значительную часть жизненного цикла; средства прямого проектирования и обратного проектирования; репозиторные CASE-системы, где модели хранятся в единой базе. Преимущества CASE — повышение качества моделей, сокращение ручной документации, согласованность проектных решений. Ограничения — стоимость, сложность внедрения, необходимость методической дисциплины.", "tags": ["инжиниринг процессов", "реинжиниринг", "параллельное проектирование", "CASE", "проектирование ИС", "моделирование"], "markdown": "### 29. Инжиниринг бизнес-процессов и информационных технологий. Технологии реинжиниринга и параллельного проектирования. CASE-системы в проектировании ИС. Понятие и виды CASE-средств\n\n**Кратко:** инжиниринг бизнес-процессов и ИТ направлен на проектирование эффективной организации деятельности и поддерживающих ее информационных систем. CASE-средства автоматизируют анализ, моделирование, проектирование и документирование ИС.\n\n**Ответ:** инжиниринг бизнес-процессов — целенаправленное проектирование, анализ и улучшение процессов организации. Он связан с информационными технологиями, потому что современная автоматизация часто требует изменения самих процессов, а не только переноса старых операций в программу.\n\nРеинжиниринг бизнес-процессов — радикальное переосмысление и перепроектирование процессов для существенного улучшения показателей: стоимости, качества, скорости, сервиса. В отличие от постепенного улучшения, реинжиниринг допускает глубокие изменения структуры работ, ответственности и информационных потоков. ИТ являются важным инструментом реинжиниринга: они позволяют убрать лишние согласования, объединить операции, обеспечить доступ к единой базе данных, автоматизировать контроль.\n\nПараллельное проектирование означает одновременную согласованную разработку бизнес-процессов, информационной системы, организационных регламентов и технической инфраструктуры. Это сокращает сроки и уменьшает риск несоответствия ИС реальной деятельности.\n\nCASE-система — программная среда, поддерживающая автоматизированное проектирование ИС. CASE-средства позволяют строить модели процессов и данных, проверять согласованность, генерировать документацию, иногда создавать схемы баз данных или программный код.\n\nВиды CASE-средств: верхнего уровня — для анализа требований и концептуального моделирования; нижнего уровня — для детального проектирования, генерации кода, базы данных; интегрированные — поддерживают значительную часть жизненного цикла; средства прямого проектирования и обратного проектирования; репозиторные CASE-системы, где модели хранятся в единой базе. Преимущества CASE — повышение качества моделей, сокращение ручной документации, согласованность проектных решений. Ограничения — стоимость, сложность внедрения, необходимость методической дисциплины.\n\n**Теги:** инжиниринг процессов; реинжиниринг; параллельное проектирование; CASE; проектирование ИС; моделирование"}, {"id": 30, "section": "Информационные системы и технологии", "question": "Методики концептуального проектирования IDEF. Методика функционального моделирования IDEF0 (SADT). Основные компоненты модели", "short_answer": "IDEF0 — методика функционального моделирования, основанная на SADT. Она описывает систему как иерархию функций, преобразующих входы в выходы под управлением и с использованием механизмов.", "answer": "методики IDEF применяются для концептуального проектирования, анализа и описания сложных систем. Они позволяют формализовать функции, процессы, данные, поведение и связи. IDEF0 предназначена для функционального моделирования: она показывает, что делает система и какие ресурсы для этого нужны.\n\nIDEF0 основана на методологии SADT — Structured Analysis and Design Technique. Главный элемент модели — функциональный блок, изображающий работу или функцию. У блока есть четыре типа стрелок: входы, выходы, управление и механизмы. Входы поступают слева и преобразуются функцией в выходы. Выходы выходят справа. Управление входит сверху и задает условия, правила, ограничения, стандарты, планы. Механизмы входят снизу и показывают исполнителей, ресурсы, оборудование, программные средства.\n\nНапример, функция «Обработать заказ» имеет вход «заявка клиента», выход «оформленный заказ», управление «правила продаж, прайс-лист», механизм «менеджер, CRM-система».\n\nМодель IDEF0 строится иерархически. Верхняя диаграмма A-0 показывает систему как один блок и ее связь со средой. Затем блок декомпозируется на диаграмме A0, где представлены основные функции. Каждая функция может быть детализирована на нижних уровнях. Важны правила согласования: дочерняя диаграмма должна сохранять смысл родительского блока, а стрелки должны быть согласованы.\n\nIDEF0 не показывает детальную временную последовательность операций; ее сила — в описании функций, ресурсов, управляющих условий и границ системы. Поэтому она полезна при обследовании предприятия, формировании требований к ИС и построении модели «как есть» и «как должно быть».", "tags": ["IDEF0", "SADT", "функциональное моделирование", "вход", "выход", "управление", "механизм", "декомпозиция"], "markdown": "### 30. Методики концептуального проектирования IDEF. Методика функционального моделирования IDEF0 (SADT). Основные компоненты модели\n\n**Кратко:** IDEF0 — методика функционального моделирования, основанная на SADT. Она описывает систему как иерархию функций, преобразующих входы в выходы под управлением и с использованием механизмов.\n\n**Ответ:** методики IDEF применяются для концептуального проектирования, анализа и описания сложных систем. Они позволяют формализовать функции, процессы, данные, поведение и связи. IDEF0 предназначена для функционального моделирования: она показывает, что делает система и какие ресурсы для этого нужны.\n\nIDEF0 основана на методологии SADT — Structured Analysis and Design Technique. Главный элемент модели — функциональный блок, изображающий работу или функцию. У блока есть четыре типа стрелок: входы, выходы, управление и механизмы. Входы поступают слева и преобразуются функцией в выходы. Выходы выходят справа. Управление входит сверху и задает условия, правила, ограничения, стандарты, планы. Механизмы входят снизу и показывают исполнителей, ресурсы, оборудование, программные средства.\n\nНапример, функция «Обработать заказ» имеет вход «заявка клиента», выход «оформленный заказ», управление «правила продаж, прайс-лист», механизм «менеджер, CRM-система».\n\nМодель IDEF0 строится иерархически. Верхняя диаграмма A-0 показывает систему как один блок и ее связь со средой. Затем блок декомпозируется на диаграмме A0, где представлены основные функции. Каждая функция может быть детализирована на нижних уровнях. Важны правила согласования: дочерняя диаграмма должна сохранять смысл родительского блока, а стрелки должны быть согласованы.\n\nIDEF0 не показывает детальную временную последовательность операций; ее сила — в описании функций, ресурсов, управляющих условий и границ системы. Поэтому она полезна при обследовании предприятия, формировании требований к ИС и построении модели «как есть» и «как должно быть».\n\n**Теги:** IDEF0; SADT; функциональное моделирование; вход; выход; управление; механизм; декомпозиция"}, {"id": 31, "section": "Информационные системы и технологии", "question": "Методики концептуального проектирования IDEF. Поведенческое моделирование сложных систем, методика IDEF3. Компоненты модели. Классификация перекрестков", "short_answer": "IDEF3 описывает поведение системы и последовательность выполнения процессов. В отличие от IDEF0, она показывает не только функции, но и сценарии, порядок работ, ветвления и синхронизацию.", "answer": "IDEF3 — методика описания процессов и поведения системы. Она используется для фиксации знаний о том, как реально выполняется работа, какие события происходят, какие операции следуют друг за другом, где возникают альтернативы и параллельное выполнение. IDEF3 особенно полезна при описании бизнес-процессов «как есть».\n\nОсновной компонент IDEF3 — единица работы, или UOB (Unit of Behavior). Она обозначает действие, событие или операцию. UOB соединяются связями предшествования, показывающими порядок выполнения. Связь может означать, что одна работа должна завершиться до начала другой, что работы могут пересекаться или что одна инициирует другую.\n\nВ IDEF3 применяются перекрестки, или junctions, для описания ветвления и объединения потоков. Перекрестки бывают типа AND, OR и XOR. AND означает, что должны выполняться все ветви; при разделении процесс идет параллельно по всем направлениям, при объединении требуется завершение всех ветвей. OR означает, что может выполняться одна или несколько ветвей. XOR означает исключающий выбор: выполняется только одна из альтернатив.\n\nПерекрестки также различают по направлению: fan-out — разветвление, fan-in — объединение. Важна синхронность: синхронные перекрестки требуют согласованного наступления условий, асинхронные допускают независимое выполнение.\n\nКроме процессных схем, IDEF3 может использовать объектные схемы состояний, где показывают изменение состояния объектов в ходе процесса. Для проектирования ИС IDEF3 помогает выявить последовательность операций, точки принятия решений, исключения, параллельные работы и требования к автоматизации сценариев.", "tags": ["IDEF3", "поведенческое моделирование", "UOB", "процесс", "перекресток", "AND", "OR", "XOR", "сценарий"], "markdown": "### 31. Методики концептуального проектирования IDEF. Поведенческое моделирование сложных систем, методика IDEF3. Компоненты модели. Классификация перекрестков\n\n**Кратко:** IDEF3 описывает поведение системы и последовательность выполнения процессов. В отличие от IDEF0, она показывает не только функции, но и сценарии, порядок работ, ветвления и синхронизацию.\n\n**Ответ:** IDEF3 — методика описания процессов и поведения системы. Она используется для фиксации знаний о том, как реально выполняется работа, какие события происходят, какие операции следуют друг за другом, где возникают альтернативы и параллельное выполнение. IDEF3 особенно полезна при описании бизнес-процессов «как есть».\n\nОсновной компонент IDEF3 — единица работы, или UOB (Unit of Behavior). Она обозначает действие, событие или операцию. UOB соединяются связями предшествования, показывающими порядок выполнения. Связь может означать, что одна работа должна завершиться до начала другой, что работы могут пересекаться или что одна инициирует другую.\n\nВ IDEF3 применяются перекрестки, или junctions, для описания ветвления и объединения потоков. Перекрестки бывают типа AND, OR и XOR. AND означает, что должны выполняться все ветви; при разделении процесс идет параллельно по всем направлениям, при объединении требуется завершение всех ветвей. OR означает, что может выполняться одна или несколько ветвей. XOR означает исключающий выбор: выполняется только одна из альтернатив.\n\nПерекрестки также различают по направлению: fan-out — разветвление, fan-in — объединение. Важна синхронность: синхронные перекрестки требуют согласованного наступления условий, асинхронные допускают независимое выполнение.\n\nКроме процессных схем, IDEF3 может использовать объектные схемы состояний, где показывают изменение состояния объектов в ходе процесса. Для проектирования ИС IDEF3 помогает выявить последовательность операций, точки принятия решений, исключения, параллельные работы и требования к автоматизации сценариев.\n\n**Теги:** IDEF3; поведенческое моделирование; UOB; процесс; перекресток; AND; OR; XOR; сценарий"}, {"id": 32, "section": "Информационные системы и технологии", "question": "Методики концептуального проектирования IDEF. Диаграммы потоков данных, методика DFD. Основные компоненты модели. Определение сущностей на информационных потоках", "short_answer": "DFD описывает, как данные перемещаются между процессами, внешними сущностями и хранилищами. Эта методика полезна для анализа информационных потоков и проектирования функций ИС.", "answer": "диаграмма потоков данных DFD (Data Flow Diagram) показывает движение информации в системе. В отличие от IDEF0, DFD акцентирует внимание не на управляющих воздействиях и механизмах, а на потоках данных, процессах обработки и хранилищах.\n\nОсновные компоненты DFD: внешняя сущность, процесс, поток данных и хранилище данных. Внешняя сущность — источник или получатель информации вне моделируемой системы: клиент, поставщик, банк, налоговый орган, другая ИС. Процесс преобразует входные данные в выходные: обработать заказ, проверить оплату, сформировать отчет. Поток данных показывает передачу информации между элементами. Хранилище данных — место накопления информации: база клиентов, справочник товаров, архив заказов.\n\nDFD строятся иерархически. Контекстная диаграмма показывает систему как единый процесс и ее обмен с внешними сущностями. Далее выполняется декомпозиция на процессы нижнего уровня. Важно соблюдать балансировку: входы и выходы процесса на родительской диаграмме должны соответствовать потокам на дочерней.\n\nОпределение сущностей на информационных потоках означает выявление объектов предметной области, сведения о которых передаются в системе. Например, поток «заявка клиента» содержит сущности Клиент, Заказ, Товар; поток «счет» — Заказ, Платеж, Организация. Эти сущности затем используются при построении ER-модели и проектировании базы данных.\n\nDFD помогает выявить лишние или отсутствующие потоки, определить границы ИС, уточнить требования к данным и функциям. Ограничение DFD состоит в том, что она слабо показывает временную логику и организационную ответственность, поэтому ее часто дополняют другими моделями.", "tags": ["DFD", "диаграмма потоков данных", "процесс", "поток данных", "внешняя сущность", "хранилище данных", "ER-модель"], "markdown": "### 32. Методики концептуального проектирования IDEF. Диаграммы потоков данных, методика DFD. Основные компоненты модели. Определение сущностей на информационных потоках\n\n**Кратко:** DFD описывает, как данные перемещаются между процессами, внешними сущностями и хранилищами. Эта методика полезна для анализа информационных потоков и проектирования функций ИС.\n\n**Ответ:** диаграмма потоков данных DFD (Data Flow Diagram) показывает движение информации в системе. В отличие от IDEF0, DFD акцентирует внимание не на управляющих воздействиях и механизмах, а на потоках данных, процессах обработки и хранилищах.\n\nОсновные компоненты DFD: внешняя сущность, процесс, поток данных и хранилище данных. Внешняя сущность — источник или получатель информации вне моделируемой системы: клиент, поставщик, банк, налоговый орган, другая ИС. Процесс преобразует входные данные в выходные: обработать заказ, проверить оплату, сформировать отчет. Поток данных показывает передачу информации между элементами. Хранилище данных — место накопления информации: база клиентов, справочник товаров, архив заказов.\n\nDFD строятся иерархически. Контекстная диаграмма показывает систему как единый процесс и ее обмен с внешними сущностями. Далее выполняется декомпозиция на процессы нижнего уровня. Важно соблюдать балансировку: входы и выходы процесса на родительской диаграмме должны соответствовать потокам на дочерней.\n\nОпределение сущностей на информационных потоках означает выявление объектов предметной области, сведения о которых передаются в системе. Например, поток «заявка клиента» содержит сущности Клиент, Заказ, Товар; поток «счет» — Заказ, Платеж, Организация. Эти сущности затем используются при построении ER-модели и проектировании базы данных.\n\nDFD помогает выявить лишние или отсутствующие потоки, определить границы ИС, уточнить требования к данным и функциям. Ограничение DFD состоит в том, что она слабо показывает временную логику и организационную ответственность, поэтому ее часто дополняют другими моделями.\n\n**Теги:** DFD; диаграмма потоков данных; процесс; поток данных; внешняя сущность; хранилище данных; ER-модель"}, {"id": 33, "section": "Информационные системы и технологии", "question": "Методики концептуального проектирования IDEF. Информационное моделирование. Методика IDEF1X, основные компоненты диаграммы «сущность-связь». Типы сущностей. Ключи и нормализация данных", "short_answer": "IDEF1X — методика информационного моделирования и проектирования реляционных баз данных. Она описывает сущности, атрибуты, ключи и связи с учетом правил целостности.", "answer": "IDEF1X используется для построения логической модели данных. Она развивает идею диаграмм «сущность-связь» и удобна при проектировании реляционных баз данных для информационных систем. Цель IDEF1X — точно описать информационные объекты предметной области и связи между ними.\n\nОсновные компоненты модели: сущности, атрибуты, ключи, связи, мощность и обязательность связей. Сущность изображает класс объектов, например Клиент, Заказ, Товар. Атрибуты описывают свойства сущности. Ключи обеспечивают идентификацию экземпляров. Первичный ключ однозначно определяет запись, внешний ключ связывает таблицу с другой таблицей.\n\nВ IDEF1X различают независимые и зависимые сущности. Независимая сущность имеет собственный ключ и существует самостоятельно. Зависимая сущность зависит от другой сущности, и ее идентификатор может включать ключ родительской сущности. Например, СтрокаЗаказа зависит от Заказа.\n\nСвязи бывают идентифицирующие и неидентифицирующие. При идентифицирующей связи ключ родительской сущности входит в первичный ключ дочерней. При неидентифицирующей — внешний ключ есть, но не является частью первичного ключа. Также указывают обязательность связи и кратность: один к одному, один ко многим.\n\nНормализация данных используется для устранения избыточности и аномалий. При проектировании проверяют первую, вторую и третью нормальные формы, анализируют функциональные зависимости, выделяют справочники и таблицы связей. Результатом IDEF1X-модели является логическая схема данных, которую можно преобразовать в структуру реляционной базы.", "tags": ["IDEF1X", "информационное моделирование", "сущность", "атрибут", "ключ", "зависимая сущность", "нормализация"], "markdown": "### 33. Методики концептуального проектирования IDEF. Информационное моделирование. Методика IDEF1X, основные компоненты диаграммы «сущность-связь». Типы сущностей. Ключи и нормализация данных\n\n**Кратко:** IDEF1X — методика информационного моделирования и проектирования реляционных баз данных. Она описывает сущности, атрибуты, ключи и связи с учетом правил целостности.\n\n**Ответ:** IDEF1X используется для построения логической модели данных. Она развивает идею диаграмм «сущность-связь» и удобна при проектировании реляционных баз данных для информационных систем. Цель IDEF1X — точно описать информационные объекты предметной области и связи между ними.\n\nОсновные компоненты модели: сущности, атрибуты, ключи, связи, мощность и обязательность связей. Сущность изображает класс объектов, например Клиент, Заказ, Товар. Атрибуты описывают свойства сущности. Ключи обеспечивают идентификацию экземпляров. Первичный ключ однозначно определяет запись, внешний ключ связывает таблицу с другой таблицей.\n\nВ IDEF1X различают независимые и зависимые сущности. Независимая сущность имеет собственный ключ и существует самостоятельно. Зависимая сущность зависит от другой сущности, и ее идентификатор может включать ключ родительской сущности. Например, СтрокаЗаказа зависит от Заказа.\n\nСвязи бывают идентифицирующие и неидентифицирующие. При идентифицирующей связи ключ родительской сущности входит в первичный ключ дочерней. При неидентифицирующей — внешний ключ есть, но не является частью первичного ключа. Также указывают обязательность связи и кратность: один к одному, один ко многим.\n\nНормализация данных используется для устранения избыточности и аномалий. При проектировании проверяют первую, вторую и третью нормальные формы, анализируют функциональные зависимости, выделяют справочники и таблицы связей. Результатом IDEF1X-модели является логическая схема данных, которую можно преобразовать в структуру реляционной базы.\n\n**Теги:** IDEF1X; информационное моделирование; сущность; атрибут; ключ; зависимая сущность; нормализация"}, {"id": 34, "section": "Информационные системы и технологии", "question": "Технологии реинжиниринга и параллельного проектирования. Поведенческое моделирование сложных систем. Методики IDEF2-IDEF14", "short_answer": "реинжиниринг и параллельное проектирование применяются для радикального улучшения процессов и одновременного согласования бизнеса, ИТ и организации. Семейство IDEF включает методики для функций, данных, поведения, онтологий, интерфейсов, ограничений и архитектур.", "answer": "реинжиниринг бизнес-процессов направлен на существенное улучшение деятельности за счет пересмотра процессов, ролей, данных и технологий. Параллельное проектирование позволяет одновременно разрабатывать бизнес-процессы, информационную систему, организационные изменения и техническую инфраструктуру. Это снижает риск, что созданная ИС будет не соответствовать реальным процессам.\n\nПоведенческое моделирование сложных систем описывает динамику: последовательности событий, сценарии, состояния объектов, условия ветвления, параллельность и синхронизацию. Оно необходимо, когда важно понять не только структуру, но и порядок функционирования системы.\n\nСемейство IDEF включает несколько методик. IDEF0 — функциональное моделирование. IDEF1 — информационное моделирование, IDEF1X — моделирование данных для реляционных БД. IDEF2 — моделирование динамики и имитационных моделей. IDEF3 — описание процессов и сценариев поведения. IDEF4 — объектно-ориентированное проектирование. IDEF5 — описание онтологий, то есть понятий предметной области и отношений между ними. IDEF6 — фиксация проектных решений и обоснований.\n\nIDEF7 связывают с аудитом информационных систем, IDEF8 — с моделированием пользовательских интерфейсов, IDEF9 — с выявлением бизнес-ограничений, IDEF10 — с моделированием архитектуры реализации, IDEF11 — с моделированием информационных артефактов, IDEF12 — с организационным моделированием, IDEF13 — с отображением трехсхемной архитектуры данных, IDEF14 — с проектированием сетей.\n\nНа практике наиболее распространены IDEF0, IDEF3 и IDEF1X. Остальные методики важны как часть общей методологической базы, но применяются реже.", "tags": ["реинжиниринг", "параллельное проектирование", "IDEF2", "IDEF3", "IDEF4", "IDEF5", "IDEF14", "поведенческое моделирование"], "markdown": "### 34. Технологии реинжиниринга и параллельного проектирования. Поведенческое моделирование сложных систем. Методики IDEF2-IDEF14\n\n**Кратко:** реинжиниринг и параллельное проектирование применяются для радикального улучшения процессов и одновременного согласования бизнеса, ИТ и организации. Семейство IDEF включает методики для функций, данных, поведения, онтологий, интерфейсов, ограничений и архитектур.\n\n**Ответ:** реинжиниринг бизнес-процессов направлен на существенное улучшение деятельности за счет пересмотра процессов, ролей, данных и технологий. Параллельное проектирование позволяет одновременно разрабатывать бизнес-процессы, информационную систему, организационные изменения и техническую инфраструктуру. Это снижает риск, что созданная ИС будет не соответствовать реальным процессам.\n\nПоведенческое моделирование сложных систем описывает динамику: последовательности событий, сценарии, состояния объектов, условия ветвления, параллельность и синхронизацию. Оно необходимо, когда важно понять не только структуру, но и порядок функционирования системы.\n\nСемейство IDEF включает несколько методик. IDEF0 — функциональное моделирование. IDEF1 — информационное моделирование, IDEF1X — моделирование данных для реляционных БД. IDEF2 — моделирование динамики и имитационных моделей. IDEF3 — описание процессов и сценариев поведения. IDEF4 — объектно-ориентированное проектирование. IDEF5 — описание онтологий, то есть понятий предметной области и отношений между ними. IDEF6 — фиксация проектных решений и обоснований.\n\nIDEF7 связывают с аудитом информационных систем, IDEF8 — с моделированием пользовательских интерфейсов, IDEF9 — с выявлением бизнес-ограничений, IDEF10 — с моделированием архитектуры реализации, IDEF11 — с моделированием информационных артефактов, IDEF12 — с организационным моделированием, IDEF13 — с отображением трехсхемной архитектуры данных, IDEF14 — с проектированием сетей.\n\nНа практике наиболее распространены IDEF0, IDEF3 и IDEF1X. Остальные методики важны как часть общей методологической базы, но применяются реже.\n\n**Теги:** реинжиниринг; параллельное проектирование; IDEF2; IDEF3; IDEF4; IDEF5; IDEF14; поведенческое моделирование"}, {"id": 35, "section": "Информационные системы и технологии", "question": "Понятие и особенности канонического проектирования ИС. Стандарты и стадии канонического проектирования. Формирование требований к ИС", "short_answer": "каноническое проектирование ИС — традиционный регламентированный подход, при котором создание системы проходит установленные стадии и сопровождается проектной документацией. Оно особенно подходит для крупных и формализованных проектов.", "answer": "каноническое проектирование ИС предполагает последовательное выполнение стадий создания системы с документальным оформлением результатов. Такой подход характерен для автоматизированных систем, разрабатываемых по государственным и отраслевым стандартам. Его преимущества — формальность, управляемость, проверяемость, наличие документации и четкое распределение ответственности. Недостатки — длительность, трудоемкость, слабая гибкость при изменении требований.\n\nВ российской практике важны стандарты комплекса ГОСТ 34. Основные стадии создания автоматизированной системы: формирование требований к системе, разработка концепции, техническое задание, эскизный проект, технический проект, рабочая документация, ввод в действие, сопровождение. На каждой стадии выпускаются определенные документы и принимаются решения о продолжении работ.\n\nФормирование требований к ИС начинается с обследования объекта автоматизации. Изучаются цели предприятия, бизнес-процессы, документы, информационные потоки, пользователи, техническая инфраструктура, проблемы существующей системы. Требования могут быть функциональными и нефункциональными. Функциональные описывают, что система должна делать: учет заказов, формирование отчетов, контроль остатков. Нефункциональные задают качество: надежность, производительность, безопасность, удобство, масштабируемость, совместимость.\n\nТребования должны быть полными, непротиворечивыми, проверяемыми и согласованными с заказчиком. На их основе определяется назначение системы, состав функций, требования к данным, интерфейсам, техническим средствам, защите, документации и порядку внедрения. Ошибка на стадии требований является одной из самых дорогих, потому что влияет на весь проект.", "tags": ["каноническое проектирование", "ГОСТ 34", "стадии создания ИС", "требования", "техническое задание", "обследование"], "markdown": "### 35. Понятие и особенности канонического проектирования ИС. Стандарты и стадии канонического проектирования. Формирование требований к ИС\n\n**Кратко:** каноническое проектирование ИС — традиционный регламентированный подход, при котором создание системы проходит установленные стадии и сопровождается проектной документацией. Оно особенно подходит для крупных и формализованных проектов.\n\n**Ответ:** каноническое проектирование ИС предполагает последовательное выполнение стадий создания системы с документальным оформлением результатов. Такой подход характерен для автоматизированных систем, разрабатываемых по государственным и отраслевым стандартам. Его преимущества — формальность, управляемость, проверяемость, наличие документации и четкое распределение ответственности. Недостатки — длительность, трудоемкость, слабая гибкость при изменении требований.\n\nВ российской практике важны стандарты комплекса ГОСТ 34. Основные стадии создания автоматизированной системы: формирование требований к системе, разработка концепции, техническое задание, эскизный проект, технический проект, рабочая документация, ввод в действие, сопровождение. На каждой стадии выпускаются определенные документы и принимаются решения о продолжении работ.\n\nФормирование требований к ИС начинается с обследования объекта автоматизации. Изучаются цели предприятия, бизнес-процессы, документы, информационные потоки, пользователи, техническая инфраструктура, проблемы существующей системы. Требования могут быть функциональными и нефункциональными. Функциональные описывают, что система должна делать: учет заказов, формирование отчетов, контроль остатков. Нефункциональные задают качество: надежность, производительность, безопасность, удобство, масштабируемость, совместимость.\n\nТребования должны быть полными, непротиворечивыми, проверяемыми и согласованными с заказчиком. На их основе определяется назначение системы, состав функций, требования к данным, интерфейсам, техническим средствам, защите, документации и порядку внедрения. Ошибка на стадии требований является одной из самых дорогих, потому что влияет на весь проект.\n\n**Теги:** каноническое проектирование; ГОСТ 34; стадии создания ИС; требования; техническое задание; обследование"}, {"id": 36, "section": "Информационные системы и технологии", "question": "Каноническое проектирование ИС. Предпроектное обследование объекта автоматизации. Разработка концепции ИС. Модели деятельности предприятий: модель «как есть» и модель «как должно быть»", "short_answer": "предпроектное обследование нужно для понимания реального состояния объекта автоматизации. Модель «as-is» описывает текущую деятельность, модель «to-be» — целевое состояние после оптимизации и внедрения ИС.", "answer": "предпроектное обследование объекта автоматизации — стадия сбора и анализа информации о предприятии до разработки проектных решений. Его цель — понять, как работает организация, какие проблемы существуют, какие процессы и данные нужно автоматизировать, какие ограничения и ресурсы имеются.\n\nВ ходе обследования изучают организационную структуру, функции подразделений, бизнес-процессы, документы, информационные потоки, используемые программы, базы данных, технические средства, права доступа, показатели эффективности, проблемы пользователей. Методы обследования: интервью, анкетирование, наблюдение, анализ документов, изучение регламентов, фотография рабочего дня, анализ отчетности, моделирование процессов.\n\nРазработка концепции ИС выполняется после обследования. Концепция определяет общие цели создания системы, варианты решения, ожидаемый эффект, состав подсистем, принципы архитектуры, требования к внедрению, риски и предварительную оценку затрат. На этой стадии выбирают: создавать систему с нуля, внедрять типовое решение, модернизировать существующую ИС или интегрировать несколько систем.\n\nМодель «как есть» (as-is) описывает текущее состояние деятельности предприятия: реальные процессы, документы, исполнителей, информационные потоки и проблемы. Она позволяет выявить дублирование, задержки, лишние согласования, ручные операции, ошибки данных.\n\nМодель «как должно быть» (to-be) описывает целевую организацию процессов после улучшения и автоматизации. Она показывает оптимизированные функции, новые роли, автоматизированные операции, измененный документооборот, требования к ИС. Важно не просто автоматизировать as-is, а использовать ИС для перехода к более эффективной модели to-be.", "tags": ["предпроектное обследование", "объект автоматизации", "концепция ИС", "as-is", "to-be", "бизнес-процессы", "обследование"], "markdown": "### 36. Каноническое проектирование ИС. Предпроектное обследование объекта автоматизации. Разработка концепции ИС. Модели деятельности предприятий: модель «как есть» и модель «как должно быть»\n\n**Кратко:** предпроектное обследование нужно для понимания реального состояния объекта автоматизации. Модель «as-is» описывает текущую деятельность, модель «to-be» — целевое состояние после оптимизации и внедрения ИС.\n\n**Ответ:** предпроектное обследование объекта автоматизации — стадия сбора и анализа информации о предприятии до разработки проектных решений. Его цель — понять, как работает организация, какие проблемы существуют, какие процессы и данные нужно автоматизир
