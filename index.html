ениями.\n\n**Ответ:** администрирование информационной системы — совокупность действий по обеспечению ее работоспособности, безопасности, производительности и развития. Для web-ориентированных ИС администратор управляет веб-сервером, сервером приложений, базой данных, операционной системой, сетью, доменами, сертификатами, пользователями и журналами.\n\nОсновные компоненты администрирования: установка и настройка ПО; управление учетными записями и правами; настройка веб-сервера; управление базой данных; резервное копирование и восстановление; мониторинг доступности и производительности; обновление системы; защита от атак; ведение журналов; управление инцидентами; документирование настроек; планирование емкости.\n\nСистемные требования зависят от нагрузки и архитектуры. Учитываются процессор, оперативная память, дисковая подсистема, сетевой канал, операционная система, веб-сервер, СУБД, интерпретатор или платформа программирования, средства безопасности. Для веб-систем важны надежность хранения, отказоустойчивость, масштабируемость, защита персональных данных и доступность.\n\nАппаратно-программные средства: серверы или виртуальные машины, сетевое оборудование, системы хранения, операционные системы Linux или Windows Server, веб-серверы Apache, Nginx, IIS, СУБД MySQL, PostgreSQL, SQL Server, серверные языки PHP, Python, Java, .NET, панели администрирования, системы мониторинга, средства резервного копирования, межсетевые экраны, антивирусные средства, системы журналирования.\n\nАдминистрирование должно быть регламентировано: кто отвечает за доступ, как часто выполняются резервные копии, как устанавливаются обновления, как реагировать на сбои, как контролировать безопасность. Без администрирования даже хорошо разработанная ИС быстро становится нестабильной и уязвимой.\n\n**Теги:** администрирование ИС; веб-сервер; СУБД; резервное копирование; мониторинг; безопасность; системные требования"}, {"id": 55, "section": "Операционные системы, сети и телекоммуникации", "question": "Использование базового пакета Web-разработчика «Денвер» и утилиты phpMyAdmin как инструмента разработки, управления и администрирования через Web-интерфейс", "short_answer": "«Денвер» — локальный набор веб-разработчика для запуска сайта на компьютере разработчика, а phpMyAdmin — веб-интерфейс для управления MySQL. Вместе они позволяют разрабатывать и тестировать PHP/MySQL-сайты без внешнего хостинга.", "answer": "базовый пакет веб-разработчика «Денвер» традиционно использовался как локальная среда для разработки сайтов. Он включал компоненты, необходимые для запуска динамических веб-приложений: веб-сервер Apache, интерпретатор PHP, СУБД MySQL, phpMyAdmin и вспомогательные утилиты. Разработчик мог создать сайт локально, проверить работу форм, скриптов и базы данных, а затем перенести проект на сервер.\n\nОсновное назначение локального пакета — имитация веб-сервера на рабочем компьютере. Это удобно для обучения и разработки: не требуется постоянный доступ к хостингу, можно быстро изменять файлы, создавать базы, проверять ошибки. Обычно сайт размещается в специальном каталоге локального сервера, а доступ выполняется через локальный адрес в браузере.\n\nphpMyAdmin — веб-приложение для администрирования MySQL через браузер. Оно позволяет создавать и удалять базы данных, создавать таблицы, изменять структуру столбцов, задавать ключи и индексы, просматривать и редактировать данные, выполнять SQL-запросы, импортировать и экспортировать базы, управлять пользователями и правами доступа.\n\nПри разработке ИС с PHP и MySQL последовательность обычно такая: запустить локальный веб-сервер, создать базу данных через phpMyAdmin, описать таблицы, настроить пользователя БД, написать PHP-скрипты подключения, реализовать формы и запросы, протестировать работу, исправить ошибки, подготовить перенос на промышленный сервер.\n\nВажно понимать, что локальная среда разработки не заменяет полноценное промышленное администрирование. На реальном сервере необходимы настройка безопасности, резервное копирование, разграничение доступа, обновления, защита от атак и контроль производительности.", "tags": ["Денвер", "phpMyAdmin", "Apache", "PHP", "MySQL", "локальный сервер", "web-разработка", "администрирование БД"], "markdown": "### 55. Использование базового пакета Web-разработчика «Денвер» и утилиты phpMyAdmin как инструмента разработки, управления и администрирования через Web-интерфейс\n\n**Кратко:** «Денвер» — локальный набор веб-разработчика для запуска сайта на компьютере разработчика, а phpMyAdmin — веб-интерфейс для управления MySQL. Вместе они позволяют разрабатывать и тестировать PHP/MySQL-сайты без внешнего хостинга.\n\n**Ответ:** базовый пакет веб-разработчика «Денвер» традиционно использовался как локальная среда для разработки сайтов. Он включал компоненты, необходимые для запуска динамических веб-приложений: веб-сервер Apache, интерпретатор PHP, СУБД MySQL, phpMyAdmin и вспомогательные утилиты. Разработчик мог создать сайт локально, проверить работу форм, скриптов и базы данных, а затем перенести проект на сервер.\n\nОсновное назначение локального пакета — имитация веб-сервера на рабочем компьютере. Это удобно для обучения и разработки: не требуется постоянный доступ к хостингу, можно быстро изменять файлы, создавать базы, проверять ошибки. Обычно сайт размещается в специальном каталоге локального сервера, а доступ выполняется через локальный адрес в браузере.\n\nphpMyAdmin — веб-приложение для администрирования MySQL через браузер. Оно позволяет создавать и удалять базы данных, создавать таблицы, изменять структуру столбцов, задавать ключи и индексы, просматривать и редактировать данные, выполнять SQL-запросы, импортировать и экспортировать базы, управлять пользователями и правами доступа.\n\nПри разработке ИС с PHP и MySQL последовательность обычно такая: запустить локальный веб-сервер, создать базу данных через phpMyAdmin, описать таблицы, настроить пользователя БД, написать PHP-скрипты подключения, реализовать формы и запросы, протестировать работу, исправить ошибки, подготовить перенос на промышленный сервер.\n\nВажно понимать, что локальная среда разработки не заменяет полноценное промышленное администрирование. На реальном сервере необходимы настройка безопасности, резервное копирование, разграничение доступа, обновления, защита от атак и контроль производительности.\n\n**Теги:** Денвер; phpMyAdmin; Apache; PHP; MySQL; локальный сервер; web-разработка; администрирование БД"}, {"id": 56, "section": "Операционные системы, сети и телекоммуникации", "question": "Работа с базами данных. Создание баз данных. Доступ к СУБД MySQL из Web с помощью PHP. Общая последовательность действий при работе с сервером MySQL. Основные типы запросов к базам данных", "short_answer": "PHP-сайт обращается к MySQL через подключение к серверу, выбор базы, выполнение SQL-запросов и обработку результата. Основные запросы: создание структуры, выборка, вставка, обновление и удаление данных.", "answer": "работа с базой данных начинается с проектирования структуры: определяются сущности, таблицы, поля, ключи, связи и ограничения. Затем база создается средствами СУБД или через phpMyAdmin. Для MySQL используются SQL-команды CREATE DATABASE, CREATE TABLE, ALTER TABLE, CREATE INDEX.\n\nДоступ из web-приложения на PHP выполняется через специальные интерфейсы, например mysqli или PDO. Общая последовательность: установить соединение с сервером MySQL; выбрать базу данных; подготовить SQL-запрос; передать параметры; выполнить запрос; получить результат; обработать строки; закрыть ресурсы или соединение. В современных приложениях важно использовать подготовленные выражения, чтобы защититься от SQL-инъекций.\n\nОсновные типы SQL-запросов делят на группы. DDL — язык определения данных: CREATE, ALTER, DROP. DML — язык манипулирования данными: SELECT, INSERT, UPDATE, DELETE. DCL — управление правами: GRANT, REVOKE. TCL — управление транзакциями: COMMIT, ROLLBACK, START TRANSACTION.\n\nSELECT используется для выборки данных, может включать WHERE, ORDER BY, GROUP BY, HAVING, JOIN, LIMIT. INSERT добавляет записи. UPDATE изменяет существующие данные. DELETE удаляет записи. JOIN объединяет данные из нескольких таблиц по связанным полям.\n\nПри работе с БД необходимо контролировать кодировку, права пользователя, ошибки соединения, корректность входных данных, целостность и безопасность. Для экономических систем важны транзакции: например, списание товара со склада и создание заказа должны выполняться согласованно. Если часть операции не удалась, изменения нужно откатить.", "tags": ["MySQL", "PHP", "база данных", "SQL", "SELECT", "INSERT", "UPDATE", "DELETE", "PDO", "подготовленные запросы"], "markdown": "### 56. Работа с базами данных. Создание баз данных. Доступ к СУБД MySQL из Web с помощью PHP. Общая последовательность действий при работе с сервером MySQL. Основные типы запросов к базам данных\n\n**Кратко:** PHP-сайт обращается к MySQL через подключение к серверу, выбор базы, выполнение SQL-запросов и обработку результата. Основные запросы: создание структуры, выборка, вставка, обновление и удаление данных.\n\n**Ответ:** работа с базой данных начинается с проектирования структуры: определяются сущности, таблицы, поля, ключи, связи и ограничения. Затем база создается средствами СУБД или через phpMyAdmin. Для MySQL используются SQL-команды CREATE DATABASE, CREATE TABLE, ALTER TABLE, CREATE INDEX.\n\nДоступ из web-приложения на PHP выполняется через специальные интерфейсы, например mysqli или PDO. Общая последовательность: установить соединение с сервером MySQL; выбрать базу данных; подготовить SQL-запрос; передать параметры; выполнить запрос; получить результат; обработать строки; закрыть ресурсы или соединение. В современных приложениях важно использовать подготовленные выражения, чтобы защититься от SQL-инъекций.\n\nОсновные типы SQL-запросов делят на группы. DDL — язык определения данных: CREATE, ALTER, DROP. DML — язык манипулирования данными: SELECT, INSERT, UPDATE, DELETE. DCL — управление правами: GRANT, REVOKE. TCL — управление транзакциями: COMMIT, ROLLBACK, START TRANSACTION.\n\nSELECT используется для выборки данных, может включать WHERE, ORDER BY, GROUP BY, HAVING, JOIN, LIMIT. INSERT добавляет записи. UPDATE изменяет существующие данные. DELETE удаляет записи. JOIN объединяет данные из нескольких таблиц по связанным полям.\n\nПри работе с БД необходимо контролировать кодировку, права пользователя, ошибки соединения, корректность входных данных, целостность и безопасность. Для экономических систем важны транзакции: например, списание товара со склада и создание заказа должны выполняться согласованно. Если часть операции не удалась, изменения нужно откатить.\n\n**Теги:** MySQL; PHP; база данных; SQL; SELECT; INSERT; UPDATE; DELETE; PDO; подготовленные запросы"}, {"id": 57, "section": "Операционные системы, сети и телекоммуникации", "question": "Разграничение прав доступа пользователей Web-сайтов. Обработка и передача данных из HTML-форм в сценарии PHP", "short_answer": "разграничение прав доступа определяет, какие действия разрешены пользователям разных ролей. Данные из HTML-форм передаются в PHP через GET или POST и должны проверяться, фильтроваться и безопасно обрабатываться.", "answer": "разграничение прав доступа на веб-сайте нужно для защиты данных и функций. Пользователи могут иметь разные роли: гость, зарегистрированный пользователь, менеджер, администратор, модератор. Каждой роли назначаются разрешения: просмотр страниц, добавление записей, редактирование, удаление, управление пользователями, доступ к отчетам.\n\nОбычно применяются аутентификация и авторизация. Аутентификация подтверждает личность пользователя, например по логину и паролю. Авторизация проверяет, имеет ли пользователь право выполнить конкретное действие. Для хранения состояния входа применяются сессии, cookie, токены. На сервере нужно проверять права при каждом защищенном действии, а не только скрывать кнопки в интерфейсе.\n\nHTML-форма передает данные на сервер через атрибуты action и method. При method=\"get\" данные доступны в PHP через массив $_GET, при method=\"post\" — через $_POST. Загруженные файлы находятся в $_FILES. Данные формы нельзя считать надежными: пользователь может изменить значения, отправить пустые или вредоносные данные.\n\nОбработка в PHP включает получение параметров, проверку наличия, фильтрацию, валидацию формата, нормализацию, проверку прав, выполнение бизнес-логики и сохранение в базе. Для вывода пользовательских данных в HTML нужно экранирование, чтобы предотвратить XSS. Для запросов к базе используются подготовленные выражения, чтобы предотвратить SQL-инъекции.\n\nТакже важна защита от CSRF при изменяющих операциях: форма должна содержать токен, который проверяется сервером. Корректное разграничение прав и безопасная обработка форм являются базой защиты любого веб-приложения.", "tags": ["права доступа", "роли", "аутентификация", "авторизация", "HTML-форма", "PHP", "GET", "POST", "сессия", "безопасность"], "markdown": "### 57. Разграничение прав доступа пользователей Web-сайтов. Обработка и передача данных из HTML-форм в сценарии PHP\n\n**Кратко:** разграничение прав доступа определяет, какие действия разрешены пользователям разных ролей. Данные из HTML-форм передаются в PHP через GET или POST и должны проверяться, фильтроваться и безопасно обрабатываться.\n\n**Ответ:** разграничение прав доступа на веб-сайте нужно для защиты данных и функций. Пользователи могут иметь разные роли: гость, зарегистрированный пользователь, менеджер, администратор, модератор. Каждой роли назначаются разрешения: просмотр страниц, добавление записей, редактирование, удаление, управление пользователями, доступ к отчетам.\n\nОбычно применяются аутентификация и авторизация. Аутентификация подтверждает личность пользователя, например по логину и паролю. Авторизация проверяет, имеет ли пользователь право выполнить конкретное действие. Для хранения состояния входа применяются сессии, cookie, токены. На сервере нужно проверять права при каждом защищенном действии, а не только скрывать кнопки в интерфейсе.\n\nHTML-форма передает данные на сервер через атрибуты action и method. При method=\"get\" данные доступны в PHP через массив $_GET, при method=\"post\" — через $_POST. Загруженные файлы находятся в $_FILES. Данные формы нельзя считать надежными: пользователь может изменить значения, отправить пустые или вредоносные данные.\n\nОбработка в PHP включает получение параметров, проверку наличия, фильтрацию, валидацию формата, нормализацию, проверку прав, выполнение бизнес-логики и сохранение в базе. Для вывода пользовательских данных в HTML нужно экранирование, чтобы предотвратить XSS. Для запросов к базе используются подготовленные выражения, чтобы предотвратить SQL-инъекции.\n\nТакже важна защита от CSRF при изменяющих операциях: форма должна содержать токен, который проверяется сервером. Корректное разграничение прав и безопасная обработка форм являются базой защиты любого веб-приложения.\n\n**Теги:** права доступа; роли; аутентификация; авторизация; HTML-форма; PHP; GET; POST; сессия; безопасность"}, {"id": 58, "section": "Операционные системы, сети и телекоммуникации", "question": "Создание базы данных пользователей Интернет-магазина. Вывод данных из базы на web-страницу", "short_answer": "база пользователей интернет-магазина хранит учетные записи, контактные данные, адреса, роли и служебную информацию. Вывод данных на страницу выполняется через запрос к БД, обработку результата и безопасное формирование HTML.", "answer": "база данных пользователей интернет-магазина должна хранить сведения, необходимые для регистрации, входа, оформления заказов и обслуживания клиентов. Типовая таблица users может содержать поля: id, email, password_hash, name, phone, role, created_at, updated_at, status. Отдельно могут храниться адреса доставки, история входов, согласия на рассылки, настройки пользователя.\n\nПри проектировании важно определить ключи и ограничения. id используется как первичный ключ. email обычно должен быть уникальным. Пароль нельзя хранить в открытом виде; хранится только хэш пароля. Роль определяет права пользователя: клиент, менеджер, администратор. Статус может показывать активность учетной записи.\n\nСоздание базы включает SQL-команды CREATE DATABASE и CREATE TABLE. Через phpMyAdmin таблицы можно создать визуально. После этого PHP-приложение подключается к MySQL, выполняет запросы регистрации, авторизации, просмотра профиля, изменения данных.\n\nВывод данных из базы на web-страницу выполняется так: установить соединение с БД; подготовить SELECT-запрос; выполнить запрос; получить строки результата; для каждой строки сформировать HTML; закрыть ресурсы. Например, администратор может видеть список пользователей, а клиент — только собственный профиль.\n\nПри выводе данных обязательно экранировать значения, чтобы пользовательский ввод не стал HTML- или JavaScript-кодом. Нельзя выводить password_hash, служебные токены и лишние персональные данные. Доступ к списку пользователей должен быть разрешен только администраторам или менеджерам. Для удобства применяются фильтрация, сортировка, пагинация и поиск. В интернет-магазине база пользователей обычно связана с таблицами orders, order_items, payments и delivery_addresses.", "tags": ["интернет-магазин", "база пользователей", "users", "MySQL", "PHP", "вывод данных", "HTML", "password_hash", "права доступа"], "markdown": "### 58. Создание базы данных пользователей Интернет-магазина. Вывод данных из базы на web-страницу\n\n**Кратко:** база пользователей интернет-магазина хранит учетные записи, контактные данные, адреса, роли и служебную информацию. Вывод данных на страницу выполняется через запрос к БД, обработку результата и безопасное формирование HTML.\n\n**Ответ:** база данных пользователей интернет-магазина должна хранить сведения, необходимые для регистрации, входа, оформления заказов и обслуживания клиентов. Типовая таблица users может содержать поля: id, email, password_hash, name, phone, role, created_at, updated_at, status. Отдельно могут храниться адреса доставки, история входов, согласия на рассылки, настройки пользователя.\n\nПри проектировании важно определить ключи и ограничения. id используется как первичный ключ. email обычно должен быть уникальным. Пароль нельзя хранить в открытом виде; хранится только хэш пароля. Роль определяет права пользователя: клиент, менеджер, администратор. Статус может показывать активность учетной записи.\n\nСоздание базы включает SQL-команды CREATE DATABASE и CREATE TABLE. Через phpMyAdmin таблицы можно создать визуально. После этого PHP-приложение подключается к MySQL, выполняет запросы регистрации, авторизации, просмотра профиля, изменения данных.\n\nВывод данных из базы на web-страницу выполняется так: установить соединение с БД; подготовить SELECT-запрос; выполнить запрос; получить строки результата; для каждой строки сформировать HTML; закрыть ресурсы. Например, администратор может видеть список пользователей, а клиент — только собственный профиль.\n\nПри выводе данных обязательно экранировать значения, чтобы пользовательский ввод не стал HTML- или JavaScript-кодом. Нельзя выводить password_hash, служебные токены и лишние персональные данные. Доступ к списку пользователей должен быть разрешен только администраторам или менеджерам. Для удобства применяются фильтрация, сортировка, пагинация и поиск. В интернет-магазине база пользователей обычно связана с таблицами orders, order_items, payments и delivery_addresses.\n\n**Теги:** интернет-магазин; база пользователей; users; MySQL; PHP; вывод данных; HTML; password_hash; права доступа"}, {"id": 59, "section": "Операционные системы, сети и телекоммуникации", "question": "Аутентификация пользователей с помощью PHP и MySQL. Хранение и шифрование паролей", "short_answer": "аутентификация проверяет личность пользователя по учетным данным. Пароли нельзя хранить в открытом виде или обратимо шифровать; в базе должен храниться стойкий хэш пароля с солью.", "answer": "аутентификация пользователей в PHP/MySQL обычно включает регистрацию, вход, создание сессии и выход. При регистрации пользователь вводит email или логин и пароль. Сервер проверяет корректность данных, уникальность email, создает хэш пароля и сохраняет учетную запись в базе данных.\n\nПри входе пользователь отправляет логин и пароль через защищенную форму. PHP-сценарий ищет пользователя в базе по логину или email, получает сохраненный хэш пароля и сравнивает введенный пароль с хэшем. Если проверка успешна, создается сессия: в $_SESSION записывается идентификатор пользователя и его роль. Далее при каждом запросе сервер проверяет сессию и права доступа.\n\nПароли не следует хранить в открытом виде. Также не рекомендуется хранить пароль в виде обратимого шифрования, потому что при компрометации ключа все пароли будут раскрыты. Правильный подход — криптографическое хэширование с солью и адаптивным алгоритмом. В PHP для этого используются функции password_hash и password_verify. password_hash автоматически создает соль и применяет безопасный алгоритм; password_verify проверяет введенный пароль.\n\nБезопасная аутентификация требует HTTPS, защиты от SQL-инъекций через подготовленные запросы, ограничения числа попыток входа, защиты от перебора паролей, безопасных cookie, регенерации идентификатора сессии после входа, выхода с уничтожением сессии. Для повышения защиты используют подтверждение email, восстановление пароля через одноразовые токены, двухфакторную аутентификацию.\n\nВ базе пользователей обычно хранят id, email, password_hash, role, status, created_at, last_login. Нельзя хранить пароли в логах, отправлять их по почте или показывать администратору. Администратор может только сбросить пароль, но не узнать старый.", "tags": ["аутентификация", "PHP", "MySQL", "пароль", "хэширование", "password_hash", "password_verify", "сессия", "безопасность"], "markdown": "### 59. Аутентификация пользователей с помощью PHP и MySQL. Хранение и шифрование паролей\n\n**Кратко:** аутентификация проверяет личность пользователя по учетным данным. Пароли нельзя хранить в открытом виде или обратимо шифровать; в базе должен храниться стойкий хэш пароля с солью.\n\n**Ответ:** аутентификация пользователей в PHP/MySQL обычно включает регистрацию, вход, создание сессии и выход. При регистрации пользователь вводит email или логин и пароль. Сервер проверяет корректность данных, уникальность email, создает хэш пароля и сохраняет учетную запись в базе данных.\n\nПри входе пользователь отправляет логин и пароль через защищенную форму. PHP-сценарий ищет пользователя в базе по логину или email, получает сохраненный хэш пароля и сравнивает введенный пароль с хэшем. Если проверка успешна, создается сессия: в $_SESSION записывается идентификатор пользователя и его роль. Далее при каждом запросе сервер проверяет сессию и права доступа.\n\nПароли не следует хранить в открытом виде. Также не рекомендуется хранить пароль в виде обратимого шифрования, потому что при компрометации ключа все пароли будут раскрыты. Правильный подход — криптографическое хэширование с солью и адаптивным алгоритмом. В PHP для этого используются функции password_hash и password_verify. password_hash автоматически создает соль и применяет безопасный алгоритм; password_verify проверяет введенный пароль.\n\nБезопасная аутентификация требует HTTPS, защиты от SQL-инъекций через подготовленные запросы, ограничения числа попыток входа, защиты от перебора паролей, безопасных cookie, регенерации идентификатора сессии после входа, выхода с уничтожением сессии. Для повышения защиты используют подтверждение email, восстановление пароля через одноразовые токены, двухфакторную аутентификацию.\n\nВ базе пользователей обычно хранят id, email, password_hash, role, status, created_at, last_login. Нельзя хранить пароли в логах, отправлять их по почте или показывать администратору. Администратор может только сбросить пароль, но не узнать старый.\n\n**Теги:** аутентификация; PHP; MySQL; пароль; хэширование; password_hash; password_verify; сессия; безопасность"}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent).items;
const q = document.getElementById('q');
const jump = document.getElementById('jump');
const go = document.getElementById('go');
const goMobile = document.getElementById('goMobile');
const toolbar = document.getElementById('toolbar');
const toggleTools = document.getElementById('toggleTools');
const menuToggle = document.getElementById('menuToggle');
const backdrop = document.getElementById('backdrop');
const results = document.getElementById('results');
const count = document.getElementById('count');
const view = document.getElementById('view');
const clear = document.getElementById('clear');
const heroBadge = document.getElementById('heroBadge');
let currentId = DATA[0].id;
let filteredItems = DATA.slice();

heroBadge.textContent = DATA.length + ' вопросов';

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function norm(s) {
  return String(s || '').toLowerCase().replace(/ё/g, 'е');
}

function paragraphs(s) {
  return esc(s).split(/\n\s*\n/).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
}

function setMenu(open) {
  document.body.classList.toggle('menu-open', Boolean(open));
}

function setTools(open) {
  const show = Boolean(open);
  document.body.classList.toggle('tools-open', show);
  if (show) {
    setMenu(false);
    setTimeout(() => q.focus(), 30);
  }
}

function currentIndex() {
  return filteredItems.findIndex(item => item.id === currentId);
}

function updateHash() {
  history.replaceState(null, '', '#q' + currentId);
}

function syncJump() {
  jump.value = currentId;
}

function goToQuestion(id) {
  const next = DATA.find(item => item.id === id);
  if (!next) return false;
  currentId = next.id;
  if (!filteredItems.some(item => item.id === currentId)) {
    q.value = '';
    renderList();
    return true;
  }
  syncJump();
  updateHash();
  renderView();
  return true;
}

function parseHash() {
  const match = location.hash.match(/^#q(\d+)$/);
  return match ? Number(match[1]) : null;
}

function score(item, terms) {
  const hay = norm([item.id, item.section, item.question, item.short_answer, item.answer, item.tags.join(' ')].join(' '));
  let sc = 0;
  for (const t of terms) {
    if (!t) continue;
    const idx = hay.indexOf(t);
    if (idx < 0) return -1;
    sc += 1000 - Math.min(idx, 999);
    if (norm(item.question).includes(t)) sc += 1000;
    if (item.tags.some(tag => norm(tag).includes(t))) sc += 500;
  }
  return sc;
}

function renderList() {
  const terms = norm(q.value).trim().split(/\s+/).filter(Boolean);
  let arr = DATA.map(item => [item, terms.length ? score(item, terms) : 0])
    .filter(x => x[1] >= 0);
  if (terms.length) arr.sort((a,b) => b[1] - a[1] || a[0].id - b[0].id);
  else arr.sort((a,b) => a[0].id - b[0].id);
  filteredItems = arr.map(([item]) => item);
  count.textContent = arr.length + ' из ' + DATA.length + ' вопросов';
  results.innerHTML = arr.map(([item]) => `
    <div class="result ${item.id === currentId ? 'active' : ''}" data-id="${item.id}">
      <div class="result-title"><span class="num">№${item.id}</span>${esc(item.question)}</div>
      <div class="result-meta">${esc(item.section)} · ${esc(item.tags.slice(0,4).join(', '))}</div>
    </div>`).join('');
  if (!arr.some(([item]) => item.id === currentId) && arr[0]) currentId = arr[0][0].id;
  syncJump();
  renderView();
}

function renderView() {
  const item = DATA.find(x => x.id === currentId) || DATA[0];
  if (!item) return;
  const index = currentIndex();
  const hasPrev = index > 0;
  const hasNext = index >= 0 && index < filteredItems.length - 1;
  view.innerHTML = `
    <div class="view-top">
      <div class="section">${esc(item.section)}</div>
      <div class="question-id">Вопрос №${item.id}</div>
    </div>
    <h2>${esc(item.question)}</h2>
    <div class="short"><strong>Кратко:</strong> ${esc(item.short_answer)}</div>
    <h3>Ответ</h3>
    ${paragraphs(item.answer)}
    <div class="tags">${item.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('')}</div>
    <div class="nav-controls">
      <button id="prevDesktop" type="button" ${hasPrev ? '' : 'disabled'}>← Предыдущий</button>
      <button id="nextDesktop" type="button" ${hasNext ? '' : 'disabled'}>Следующий →</button>
    </div>
  `;
  document.querySelectorAll('.result').forEach(el => el.classList.toggle('active', Number(el.dataset.id) === currentId));
  const prevDesktop = document.getElementById('prevDesktop');
  const nextDesktop = document.getElementById('nextDesktop');
  prevDesktop.addEventListener('click', () => moveBy(-1));
  nextDesktop.addEventListener('click', () => moveBy(1));
  updateHash();
}

function moveBy(step) {
  const index = currentIndex();
  const next = filteredItems[index + step];
  if (!next) return;
  currentId = next.id;
  syncJump();
  renderView();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openQuestionFromJump() {
  const id = Number(jump.value);
  if (!id) return;
  if (goToQuestion(id)) {
    setMenu(false);
    setTools(false);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

results.addEventListener('click', e => {
  const row = e.target.closest('.result');
  if (!row) return;
  currentId = Number(row.dataset.id);
  syncJump();
  renderView();
  setMenu(false);
  setTools(false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
q.addEventListener('input', renderList);
jump.addEventListener('keydown', e => {
  if (e.key === 'Enter') openQuestionFromJump();
});
go.addEventListener('click', openQuestionFromJump);
goMobile.addEventListener('click', openQuestionFromJump);
toggleTools.addEventListener('click', () => {
  setTools(!document.body.classList.contains('tools-open'));
});
menuToggle.addEventListener('click', () => {
  setTools(false);
  setMenu(true);
});
backdrop.addEventListener('click', () => setMenu(false));
clear.addEventListener('click', () => {
  q.value = '';
  q.focus();
  renderList();
});
window.addEventListener('hashchange', () => {
  const id = parseHash();
  if (id) goToQuestion(id);
});
window.addEventListener('resize', () => {
  if (window.innerWidth > 900) {
    setMenu(false);
    setTools(false);
  }
});
const hashId = parseHash();
if (hashId) currentId = hashId;
syncJump();
renderList();
</script>
</body>
</html>
